# Render Blueprint: one Docker web service serving both the API and the React app.
services:
  - type: web
    name: weather-aware-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Set this one in the Render dashboard (never commit it); without it, routes use OSRM's car profile.
      - key: ORS_API_KEY
        sync: false
