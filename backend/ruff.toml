# Lint settings live here, not in pyproject.toml: Vercel treats a pyproject.toml
# as the dependency list, and ours are in requirements.txt.
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "staticfiles"]

[lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, django
select = ["F", "E", "W", "I", "B", "UP", "SIM", "DJ"]
# zip(a, a[1:]) pairs neighbours on purpose; strict=True would break it.
ignore = ["B905"]
