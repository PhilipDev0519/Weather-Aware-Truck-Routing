name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py test routing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t truck-routing .
      - name: Start the image and check it answers
        run: |
          docker run -d --name app -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci -e DJANGO_ALLOWED_HOSTS=localhost truck-routing
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/api/health && break
            sleep 1
          done
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
          curl -fs http://localhost:8000/api/rules | grep -q '"wind"'
